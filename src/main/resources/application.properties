spring.application.name=CadastroDeNinjas

# Configuracao Flexivel do Banco (Docker = Postgres | Local = H2)
# A linha do driverClassName foi removida de proposito!
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# H2 Console (So tera efeito se rodar localmente sem o Docker)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway
spring.flyway.enable=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

# Ansi
spring.output.ansi.enabled=ALWAYS

spring.mvc.hiddenmethod.filter.enabled=true